[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chint-etm-mdm"
dynamic = ["version"]
description = "Portable CHINT ETM upload_goods template filler"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.7",
  "openpyxl>=3.1",
  "certifi>=2024.2",
]

[project.scripts]
chint-etm-mdm = "chint_etm_mdm.app:main"
chint-etm-mdm-fill = "chint_etm_mdm.cli:main"

[tool.setuptools.dynamic]
version = {attr = "chint_etm_mdm.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chint_etm_mdm = ["rules/*.json", "partners/*.json"]
